name: Testes do CommunityLab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      LLM_MODO: mock
      OCI_NAMESPACE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Executar testes
        run: python -m pytest -q -m "not real"
      - name: Verificar avaliação reproduzível em modo simulado
        run: |
          python scripts/avaliar_classificacoes.py --modo mock --cenario tipo_oculto
          python scripts/avaliar_classificacoes.py --modo mock --cenario tipo_informado
          python scripts/analisar_comunidade.py --demonstracao
